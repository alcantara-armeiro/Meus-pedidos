<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alcantara Armeiro</title>
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alcantara Armeiro">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    background:linear-gradient(rgba(0,0,0,.93),rgba(0,0,0,.95)),url('https://images.unsplash.com/photo-1511884642898-4c92249e20b6?q=80&w=1400');
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    color:white;
    font-family:'Orbitron',sans-serif;
    min-height:100vh;
    padding:0;
overflow-x:hidden;
-webkit-tap-highlight-color: transparent;
user-select:none;
}

.container{max-width:1000px;margin:auto;}

.dashboard{
    min-height:100vh;
    background:rgba(0,0,0,.88);
    border:none;
    border-radius:0;
    padding:18px;
    backdrop-filter:blur(10px);
    box-shadow:0 0 30px rgba(200,162,45,.3), inset 0 0 15px rgba(200,162,45,.15);
}

.logo{text-align:center;margin-bottom:25px;}
.logo img{
    width:180px;
    height:180px;
    border-radius:50%;
    border:4px solid #c8a22d;
    object-fit:cover;
    box-shadow:0 0 30px rgba(200,162,45,.6);
    margin-bottom:15px;
}
.logo h1{
    color:#e4c766;
    font-size:34px;
    letter-spacing:3px;
    margin-bottom:10px;
    text-shadow:0 0 10px rgba(228,199,102,.5);
}
.logo p{color:#aaa;letter-spacing:2px;font-size:14px;}

.card{
    background:rgba(15,15,15,.92);
    border:1px solid rgba(200,162,45,.4);
    border-radius:20px;
    padding:20px;
    margin-bottom:20px;
}

.section{color:#e4c766;font-size:17px;letter-spacing:2px;margin-bottom:15px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;}

input,select,textarea{
    width:100%;
    background:#0d0d0d;
    border:1px solid #333;
    border-radius:12px;
    padding:14px;
    color:white;
    font-family:'Orbitron',sans-serif;
    margin-bottom:15px;
    transition:.3s;
}

input:focus,select:focus,textarea:focus{
    outline:none;
    border-color:#e4c766;
    box-shadow:0 0 15px rgba(228,199,102,.3);
}

input[readonly]{
    opacity:.85;
    cursor:not-allowed;
}

select option{background:#0d0d0d;color:white;}

.helper{
    color:#a7a7a7;
    font-size:11px;
    margin:-5px 0 15px;
    letter-spacing:1px;
}

.piece-box{display:flex;gap:10px;}

.btn{
    border:none;
    border-radius:16px;
    min-height:52px;
    font-size:13px;
    box-shadow:0 4px 10px rgba(0,0,0,.4);
    padding:12px 18px;
    cursor:pointer;
    font-family:'Orbitron',sans-serif;
    font-size:12px;
    font-weight:700;
    letter-spacing:1px;
    transition:.3s;
}

.gold{background:linear-gradient(180deg,#f7d873,#b8860b);color:black;}
.gold:hover{transform:translateY(-2px);box-shadow:0 0 20px rgba(228,199,102,.4);}
.red{background:#6f0000;color:white;}
.red:hover{background:#9e0000;}
.gray{background:#222;color:white;}
.gray:hover{background:#333;}
.green{background:#0f6a34;color:white;}
.green:hover{background:#148847;}

.buttons{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin-top:20px;
}

ul{list-style:none;margin-top:15px;}

li{
    background:#0d0d0d;
    border:1px solid #333;
    border-radius:12px;
    padding:12px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.list-text{flex:1;line-height:1.6;}
.list-actions{display:flex;gap:8px;flex-wrap:wrap;}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;}

.order{
    background:rgba(15,15,15,.95);
    border:1px solid rgba(200,162,45,.4);
    border-radius:20px;
    padding:20px;
    cursor:pointer;
    transition:.3s;
}

.order:hover{transform:translateY(-5px);box-shadow:0 0 20px rgba(228,199,102,.25);}
.order h3{color:#e4c766;margin-bottom:10px;}
.badge{
    margin-top:12px;
    display:inline-block;
    background:#e4c766;
    color:black;
    padding:5px 10px;
    border-radius:30px;
    font-size:11px;
    font-weight:bold;
}
.hidden{display:none;}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
    flex-wrap:wrap;
    gap:15px;
}

.install{position:fixed;bottom:20px;right:20px;z-index:999;}
.empty{
    text-align:center;
    color:#9d9d9d;
    padding:25px 10px;
    border:1px dashed #444;
    border-radius:16px;
}

@media(max-width:700px){
    .grid{grid-template-columns:1fr;}
    .piece-box{flex-direction:column;}
    .buttons{flex-direction:column;}
    .btn{width:100%;}
    .logo img{width:140px;height:140px;}
    .logo h1{font-size:24px;}
    li{flex-direction:column;align-items:flex-start;}
    .list-actions{width:100%;}
}
    
    .btn:active{
    transform:scale(.97);
}

input, button, select, textarea {
    font-size:16px;
}
    
    
</style>
</head>
<body>

<div class="container">

<div id="formScreen">
    <div class="dashboard">
        <div class="logo">
            <img src="logo.jpg" alt="Logo Alcantara Armeiro">
            <h1>ALCANTARA ARMEIRO</h1>
            <p> • PEDIDO DE PEÇAS • </p>
        </div>

        <div class="card">
            <div class="section">FORNECEDOR</div>

            <div class="grid">
                <div>
                    <select id="fornecedorSelect" onchange="preencherFornecedorPorSelecao()">
                        <option value="">Selecione o fornecedor</option>
                    </select>
                    <div class="helper">Selecione um fornecedor cadastrado para preencher o WhatsApp automaticamente.</div>
                </div>

                <div>
                    <input type="text" id="telefone" placeholder="WhatsApp do fornecedor" readonly>
                    <div class="helper">Cadastre fornecedores na tela de fornecedores.</div>
                </div>
            </div>

            <button class="btn gray" onclick="abrirFornecedores()">FORNECEDORES</button>

            <div class="section" style="margin-top:20px;">EQUIPAMENTO</div>

            <div class="grid">
                <input type="text" id="modelo" placeholder="Modelo do equipamento">
                <input type="text" id="marca" placeholder="Marca do equipamento">
            </div>

            <input type="text" id="serie" placeholder="Número de série">

            <div class="section">PEÇAS</div>

            <div class="piece-box">
                <input type="text" id="pecaInput" placeholder="Digite a peça">
                <button class="btn gold" onclick="addPeca()">+ ADICIONAR</button>
            </div>

            <ul id="listaPecas"></ul>

            <div class="buttons">
                <button class="btn gold" onclick="salvarPedido()">SALVAR</button>
                <button class="btn green" onclick="enviarWhatsapp()">ENVIAR WHATSAPP</button>
                <button class="btn red" onclick="excluirAtual()">EXCLUIR</button>
                <button class="btn gray" onclick="abrirLista()">PEDIDOS</button>
            </div>
        </div>
    </div>
</div>

<div id="listaScreen" class="hidden">
    <div class="dashboard">
        <div class="top">
            <h2 style="color:#e4c766;">PEDIDOS SALVOS</h2>
            <button class="btn gold" onclick="novoPedido()">FORMULÁRIO</button>
        </div>
        <div class="cards" id="cardsPedidos"></div>
    </div>
</div>

<div id="fornecedoresScreen" class="hidden">
    <div class="dashboard">
        <div class="top">
            <h2 style="color:#e4c766;">CADASTRO DE FORNECEDORES</h2>
            <button class="btn gold" onclick="voltarFormulario()">VOLTAR</button>
        </div>

        <div class="card">
            <div class="section">NOVO FORNECEDOR</div>
            <div class="grid">
                <input type="text" id="fornecedorNomeCadastro" placeholder="Nome do fornecedor">
                <input type="text" id="fornecedorWhatsappCadastro" placeholder="WhatsApp do fornecedor">
            </div>
            <div class="buttons" style="margin-top:0;justify-content:flex-start;">
                <button class="btn gold" onclick="salvarFornecedor()">SALVAR FORNECEDOR</button>
                <button class="btn gray" onclick="limparCadastroFornecedor()">LIMPAR</button>
            </div>
        </div>

        <div class="card">
            <div class="section">FORNECEDORES CADASTRADOS</div>
            <ul id="listaFornecedores"></ul>
        </div>
    </div>
</div>

<div class="install">
    <button id="installBtn" class="btn gold hidden">INSTALAR APP</button>
</div>

<script>
if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js');
}

let deferredPrompt;
window.addEventListener('beforeinstallprompt',(e)=>{
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('installBtn').classList.remove('hidden');
});

document.getElementById('installBtn').addEventListener('click', async () => {
    if (!deferredPrompt) {
        alert('Instalação não disponível ainda. Abra pelo Chrome e aguarde alguns segundos.');
        return;
    }

    deferredPrompt.prompt();

    const choiceResult = await deferredPrompt.userChoice;

    if (choiceResult.outcome === 'accepted') {
        console.log('Usuário aceitou instalação');
    } else {
        console.log('Usuário cancelou instalação');
    }

    deferredPrompt = null;
    document.getElementById('installBtn').classList.add('hidden');
});

let pecas = [];
let pedidos = JSON.parse(localStorage.getItem('pedidos')) || [];
let fornecedores = JSON.parse(localStorage.getItem('fornecedores')) || [];
let editandoId = null;
let editandoFornecedorId = null;

function salvarLocalStorage(){
    localStorage.setItem('pedidos', JSON.stringify(pedidos));
    localStorage.setItem('fornecedores', JSON.stringify(fornecedores));
}

function renderPecas(){
    const lista = document.getElementById('listaPecas');
    lista.innerHTML = '';

    if(!pecas.length){
        lista.innerHTML = '<li><span class="list-text">Nenhuma peça adicionada.</span></li>';
        return;
    }

    pecas.forEach((peca,index)=>{
    lista.innerHTML += `
    <li>

        <span class="list-text">${peca}</span>

        <div class="list-actions">

            <button
                class="btn gray"
                style="padding:8px 12px;"
                onclick="editarPeca(${index})">
                EDITAR
            </button>

            <button
                class="btn red"
                style="padding:8px;min-width:50px;"
                onclick="removerPeca(${index})">
                X
            </button>

        </div>

    </li>`;
});
}

function addPeca(){
    const input = document.getElementById('pecaInput');
    const valor = input.value.trim();
    if(valor === '') return;
    pecas.push(valor);
    input.value = '';
    renderPecas();
}

function removerPeca(index){
    pecas.splice(index,1);
    renderPecas();
}
    function editarPeca(index){
    const novoValor = prompt('Editar peça:', pecas[index]);

    if(novoValor === null) return;

    const texto = novoValor.trim();

    if(texto === '') return;

    pecas[index] = texto;

    renderPecas();
}

function carregarFornecedoresSelect(selectedValue = ''){
    const select = document.getElementById('fornecedorSelect');
    select.innerHTML = '<option value="">Selecione o fornecedor</option>';

    fornecedores
        .slice()
        .sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'))
        .forEach((fornecedor)=>{
            const option = document.createElement('option');
            option.value = String(fornecedor.id);
            option.textContent = fornecedor.nome;
            option.dataset.nome = fornecedor.nome;
            option.dataset.whatsapp = fornecedor.whatsapp;
            select.appendChild(option);
        });

    if(selectedValue){
        select.value = String(selectedValue);
    }
}

function preencherFornecedorPorSelecao(){
    const select = document.getElementById('fornecedorSelect');
    const option = select.options[select.selectedIndex];
    document.getElementById('telefone').value = option && option.dataset && option.dataset.whatsapp ? option.dataset.whatsapp : '';
}

function obterFornecedorSelecionado(){
    const select = document.getElementById('fornecedorSelect');
    const option = select.options[select.selectedIndex];

    if(!select.value || !option){
        return null;
    }

    return {
        fornecedorId: select.value,
        fornecedor: option.dataset.nome || option.textContent,
        telefone: option.dataset.whatsapp || ''
    };
}

function salvarPedido(){
    const fornecedorSelecionado = obterFornecedorSelecionado();

    if(!fornecedorSelecionado){
        alert('Selecione um fornecedor cadastrado.');
        return;
    }

    const pedido = {
        id: editandoId || Date.now(),
        fornecedorId: fornecedorSelecionado.fornecedorId,
        fornecedor: fornecedorSelecionado.fornecedor,
        telefone: fornecedorSelecionado.telefone,
        modelo: document.getElementById('modelo').value.trim(),
        marca: document.getElementById('marca').value.trim(),
        serie: document.getElementById('serie').value.trim(),
        pecas:[...pecas],
        data:new Date().toLocaleDateString('pt-BR')
    };

    if(editandoId){
        const index = pedidos.findIndex((p)=>p.id===editandoId);
        if(index !== -1){
            pedidos[index] = pedido;
        }
    }else{
        pedidos.push(pedido);
    }

    salvarLocalStorage();
    alert(editandoId ? 'Pedido atualizado!' : 'Pedido salvo!');
    limparFormulario();
    abrirLista();
}

function abrirLista(){
    document.getElementById('formScreen').classList.add('hidden');
    document.getElementById('fornecedoresScreen').classList.add('hidden');
    document.getElementById('listaScreen').classList.remove('hidden');
    renderPedidos();
}

function renderPedidos(){
    const area = document.getElementById('cardsPedidos');
    area.innerHTML = '';

    if(!pedidos.length){
        area.innerHTML = '<div class="empty">Nenhum pedido salvo ainda.</div>';
        return;
    }

    pedidos.slice().reverse().forEach((p)=>{
        area.innerHTML += `
        <div class="order" onclick="abrirPedido(${p.id})">
            <h3>${p.modelo || 'Pedido sem modelo'}</h3>
            <p><strong>Fornecedor:</strong> ${p.fornecedor || '-'}</p>
            <p><strong>Marca:</strong> ${p.marca || '-'}</p>
            <p><strong>WhatsApp:</strong> ${p.telefone || '-'}</p>
            <p><strong>Peças:</strong> ${p.pecas.length}</p>
            <div class="badge">${p.data}</div>
        </div>`;
    });
}

function garantirFornecedorNoSelect(pedido){
    const select = document.getElementById('fornecedorSelect');
    const valorEsperado = String(pedido.fornecedorId || '');
    const opcaoExistente = Array.from(select.options).find((option)=>option.value === valorEsperado && valorEsperado);

    if(opcaoExistente){
        return valorEsperado;
    }

    const fornecedorPorNome = fornecedores.find((item)=>item.nome === pedido.fornecedor);
    if(fornecedorPorNome){
        return String(fornecedorPorNome.id);
    }

    const legado = document.createElement('option');
    legado.value = `legado-${pedido.id}`;
    legado.textContent = `${pedido.fornecedor || 'Fornecedor antigo'} (não cadastrado)`;
    legado.dataset.nome = pedido.fornecedor || '';
    legado.dataset.whatsapp = pedido.telefone || '';
    select.appendChild(legado);
    return legado.value;
}

function abrirPedido(id){
    const pedido = pedidos.find((p)=>p.id===id);
    if(!pedido) return;

    editandoId = pedido.id;
    carregarFornecedoresSelect();
    const valorFornecedor = garantirFornecedorNoSelect(pedido);
    document.getElementById('fornecedorSelect').value = valorFornecedor;
    preencherFornecedorPorSelecao();
    document.getElementById('modelo').value = pedido.modelo || '';
    document.getElementById('marca').value = pedido.marca || '';
    document.getElementById('serie').value = pedido.serie || '';
    pecas = [...(pedido.pecas || [])];
    renderPecas();
    document.getElementById('listaScreen').classList.add('hidden');
    document.getElementById('fornecedoresScreen').classList.add('hidden');
    document.getElementById('formScreen').classList.remove('hidden');
}

function limparFormulario(){
    editandoId = null;
    pecas = [];
    renderPecas();
    carregarFornecedoresSelect();
    document.getElementById('fornecedorSelect').value = '';
    document.getElementById('telefone').value = '';
    document.getElementById('modelo').value = '';
    document.getElementById('marca').value = '';
    document.getElementById('serie').value = '';
    document.getElementById('pecaInput').value = '';
}

function excluirAtual(){
    if(!editandoId){
        alert('Abra um pedido salvo para excluir.');
        return;
    }

    pedidos = pedidos.filter((p)=>p.id!==editandoId);
    salvarLocalStorage();
    limparFormulario();
    abrirLista();
}

function novoPedido(){
    document.getElementById('listaScreen').classList.add('hidden');
    document.getElementById('fornecedoresScreen').classList.add('hidden');
    document.getElementById('formScreen').classList.remove('hidden');
    limparFormulario();
}

function abrirFornecedores(){
    document.getElementById('formScreen').classList.add('hidden');
    document.getElementById('listaScreen').classList.add('hidden');
    document.getElementById('fornecedoresScreen').classList.remove('hidden');
    renderFornecedores();
}

function voltarFormulario(){
    document.getElementById('fornecedoresScreen').classList.add('hidden');
    document.getElementById('listaScreen').classList.add('hidden');
    document.getElementById('formScreen').classList.remove('hidden');
}

function limparCadastroFornecedor(){
    editandoFornecedorId = null;
    document.getElementById('fornecedorNomeCadastro').value = '';
    document.getElementById('fornecedorWhatsappCadastro').value = '';
}

function salvarFornecedor(){
    const nome = document.getElementById('fornecedorNomeCadastro').value.trim();
    const whatsapp = document.getElementById('fornecedorWhatsappCadastro').value.trim();

    if(!nome || !whatsapp){
        alert('Preencha nome e WhatsApp do fornecedor.');
        return;
    }

    const fornecedor = {
        id: editandoFornecedorId || Date.now(),
        nome,
        whatsapp
    };

    if(editandoFornecedorId){
        const index = fornecedores.findIndex((item)=>item.id===editandoFornecedorId);
        if(index !== -1){
            fornecedores[index] = fornecedor;
        }
    }else{
        fornecedores.push(fornecedor);
    }

    salvarLocalStorage();
    carregarFornecedoresSelect();
    renderFornecedores();
    limparCadastroFornecedor();
    alert(editandoFornecedorId ? 'Fornecedor atualizado!' : 'Fornecedor cadastrado!');
}

function editarFornecedor(id){
    const fornecedor = fornecedores.find((item)=>item.id===id);
    if(!fornecedor) return;
    editandoFornecedorId = fornecedor.id;
    document.getElementById('fornecedorNomeCadastro').value = fornecedor.nome;
    document.getElementById('fornecedorWhatsappCadastro').value = fornecedor.whatsapp;
}

function excluirFornecedor(id){
    fornecedores = fornecedores.filter((item)=>item.id!==id);
    salvarLocalStorage();
    carregarFornecedoresSelect();
    renderFornecedores();
    if(editandoFornecedorId===id){
        limparCadastroFornecedor();
    }
}

function renderFornecedores(){
    const lista = document.getElementById('listaFornecedores');
    lista.innerHTML = '';

    if(!fornecedores.length){
        lista.innerHTML = '<li><span class="list-text">Nenhum fornecedor cadastrado.</span></li>';
        return;
    }

    fornecedores
        .slice()
        .sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'))
        .forEach((fornecedor)=>{
            lista.innerHTML += `
            <li>
                <div class="list-text">
                    <strong>${fornecedor.nome}</strong><br>
                    WhatsApp: ${fornecedor.whatsapp}
                </div>
                <div class="list-actions">
                    <button class="btn gray" onclick="editarFornecedor(${fornecedor.id})">EDITAR</button>
                    <button class="btn red" onclick="excluirFornecedor(${fornecedor.id})">EXCLUIR</button>
                </div>
            </li>`;
        });
}

function normalizarWhatsapp(numero){
    let digits = String(numero || '').replace(/\D/g,'');
    while(digits.startsWith('0')){
        digits = digits.substring(1);
    }
    if(digits.length === 10 || digits.length === 11){
        digits = `55${digits}`;
    }
    return digits;
}

function montarMensagemPedido(){
    const fornecedorSelecionado = obterFornecedorSelecionado();
    const pecasTexto = pecas.length
        ? pecas.map((peca,index)=>`${index + 1}. ${peca}`).join('\n')
        : 'Nenhuma peça informada';

    const linhas = [
        'Olá! Segue pedido de peças.',
        '',
        `Fornecedor: ${fornecedorSelecionado ? fornecedorSelecionado.fornecedor : '-'}`,
        `Modelo: ${document.getElementById('modelo').value.trim() || '-'}`,
        `Marca: ${document.getElementById('marca').value.trim() || '-'}`,
        `Série: ${document.getElementById('serie').value.trim() || '-'}`,
        '',
        'Peças solicitadas:',
        pecasTexto
    ];

    return encodeURIComponent(linhas.join('\n'));
}

function enviarWhatsapp(){
    const telefone = document.getElementById('telefone').value.trim();
    const numero = normalizarWhatsapp(telefone);

    if(!numero){
        alert('Selecione um fornecedor com WhatsApp válido.');
        return;
    }

    const url = `https://wa.me/${numero}?text=${montarMensagemPedido()}`;
    window.open(url, '_blank');
}

carregarFornecedoresSelect();
renderFornecedores();
